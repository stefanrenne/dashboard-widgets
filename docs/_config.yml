# The widgets part of https://getdashboard.dev/ (/widgets/, develop under /widgets/develop/). It is
# staged by the dashboard's scripts/pages.sh (DOCS_PART=widgets): the theme's settings come from
# there, this file adds the menu of these pages. The menu is the dashboard docs' (Home,
# Configuration, Widgets, Extend), with Widgets open: the others are links there. The pages per
# widget (Service widgets and Header widgets, nav_order 1 and 2 under Widgets) are generated from
# widgets/<id>/ by its scripts/pages-widgets.mjs.
defaults:
  - { scope: { path: README.md }, values: { title: Widgets, nav_order: 3, has_children: true, permalink: / } }
  - { scope: { path: catalogue.md }, values: { title: Catalogue, parent: Widgets, nav_order: 3 } }
