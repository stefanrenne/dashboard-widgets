name: CI

# Work happens on develop: every push there is tested, and a develop build of the dashboard
# installs this branch. main only moves to develop for a release (a fast-forward); a tag vX.Y.Z
# on main is a release.
on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or PR cancels its older run. Tags (releases) have a ref of their own, and
# manual and scheduled runs a group of their own, so a push never stops a release or a rebuild.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # the dashboard image's LTS line
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # A tag vX.Y.Z on a commit on main becomes a GitHub release (a push to main alone releases
  # nothing): the widgets that are new or updated since the previous tag, each with its
  # CHANGELOG lines (scripts/release-notes.mjs), and one zip of the collection.
  # Run by hand on main (workflow_dispatch), it releases package.json's version and creates the
  # tag on that commit, for when a tag cannot be pushed; a version released already is skipped.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, to compare the widgets with the previous release
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # the dashboard image's LTS line
      - name: The tag, checked against package.json and main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$pkg"
                  if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is released already: nothing to release"; echo "SKIP=true" >> "$GITHUB_ENV"; exit 0; fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [ "${tag#v}" != "$pkg" ]; then echo "::error::tag $tag but package.json says $pkg"; exit 1; fi
          # only a commit on main is released
          if ! git merge-base --is-ancestor HEAD origin/main; then echo "::error::$tag is not a commit on main: only releases from main are published"; exit 1; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Notes and assets
        if: env.SKIP != 'true'
        run: |
          version="${TAG#v}"
          # fails when CHANGELOG.md has no section for the version, or names no line for an
          # updated widget
          node scripts/release-notes.mjs "$version" > notes.md
          cat notes.md
          mkdir dist
          zip -qr "dist/dashboard-widgets-$version.zip" widgets README.md LICENSE 2>/dev/null || zip -qr "dist/dashboard-widgets-$version.zip" widgets README.md
          ls dist
      - if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # a pushed tag must exist; by hand, the release creates the tag on this commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then target=(--target "$GITHUB_SHA"); else target=(--verify-tag); fi
          gh release create "$TAG" dist/*.zip --title "$TAG" --notes-file notes.md "${target[@]}"
      # the dashboard's docs site (stefanrenne/dashboard-site) builds a page per widget, at the root
      # from the newest release: rebuild the root now (PAGES_DISPATCH_TOKEN: a fine-grained token
      # with Actions read and write on dashboard-site; without it this step only says so)
      - name: Rebuild the documentation site
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::no PAGES_DISPATCH_TOKEN: run site.yml in dashboard-site by hand (mode collection)"; exit 0; fi
          gh workflow run site.yml --repo stefanrenne/dashboard-site -f mode=collection
