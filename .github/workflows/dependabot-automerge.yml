name: Dependabot auto-merge

# When CI passed on a Dependabot pull request (the tests), merge it and run CI on develop, where its PRs go (dependabot.yml).
# Runs as workflow_run, in the context of the default branch: it never checks out the PR's code.
#
# Only patch and minor updates are merged; major updates and workflow changes (github-actions updates)
# wait for a review. AUTOMERGE_TOKEN (optional, a fine-grained token for this repository only: Contents
# and Pull requests read and write) makes the merge a normal push, so CI starts by itself.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          OWN_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # only the open Dependabot PR of that branch, and only the commit CI tested
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,author,headRefOid,baseRefName \
                 --jq ".[] | select(.author.login == \"app/dependabot\" and .headRefOid == \"$SHA\") | \"\\(.number) \\(.baseRefName)\"")
          read -r pr base <<<"$pr"
          if [ -z "$pr" ]; then echo "No open Dependabot PR for $BRANCH at $SHA"; exit 0; fi
          # Only patch and minor updates go in by themselves. A major update (another first version number)
          # and a change to a workflow file (an action update: it runs with this repository's tokens) wait
          # for a review: merge those by hand.
          workflows=$(gh pr diff "$pr" --repo "$REPO" --name-only | grep -c '^\.github/workflows/' || true)
          if [ "$workflows" != "0" ]; then
            echo "::notice::PR #$pr changes a workflow file: review and merge it by hand."
            exit 0
          fi
          majors=$(gh pr view "$pr" --repo "$REPO" --json title,body --jq '.title + "\n" + .body' \
            | grep -oE 'from `?v?[0-9][^ `]*`? to `?v?[0-9][^ `]*' \
            | awk '{ a = $2; b = $4; gsub(/[`v]/, "", a); gsub(/[`v]/, "", b); ma = a; mb = b; sub(/[^0-9].*/, "", ma); sub(/[^0-9].*/, "", mb); if (ma != mb) print a " -> " b }' \
            | sort -u | paste -sd, -)
          if [ -n "$majors" ]; then
            echo "::notice::PR #$pr has a major update ($majors): review and merge it by hand."
            exit 0
          fi
          if ! out=$(gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA" 2>&1); then
            echo "$out"
            if grep -q "workflows. permission" <<<"$out"; then
              echo "::notice::PR #$pr changes a workflow file; GITHUB_TOKEN may not merge that. Merge it by hand, or add the AUTOMERGE_TOKEN secret."
              exit 0
            fi
            if grep -q "merge conflicts" <<<"$out"; then
              echo "::notice::PR #$pr conflicts with $base after another merge; Dependabot rebases it and CI runs again."
              exit 0
            fi
            exit 1
          fi
          # a merge with GITHUB_TOKEN does not start the push workflow: run CI on its base branch explicitly.
          # With AUTOMERGE_TOKEN the merge is a normal push and starts CI itself.
          if [ "$OWN_TOKEN" != "true" ]; then gh workflow run ci.yml --repo "$REPO" --ref "$base"; fi
