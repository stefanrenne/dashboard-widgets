id: mikrotik
name: MikroTik
version: 0.4.0
apiVersion: 2
description: Uptime, CPU load, memory used and DHCP leases of a MikroTik router (homepage's mikrotik widget).
refresh: 30s
options:
  url: { type: url, required: true }       # the router, e.g. https://router.lan (RouterOS 7 REST API, often https only)
  username: { type: string, required: true }
  password: { type: string, secret: true, required: true }
  insecure: { type: boolean, default: false }   # accept the router's self-signed certificate
attributes:                 # public values for a service's filter: (widget.<name>)
  cpuLoad: { type: number, from: cpuLoad }                 # CPU (%)
  memoryUsed: { type: number, from: memoryUsed }           # Memory (%)
  numberOfLeases: { type: number, from: numberOfLeases }   # DHCP leases
  uptimeHours: { type: number }                            # hours since the router started
  attention: { type: boolean, from: '@attention' }         # true while the card marks something as needing attention
