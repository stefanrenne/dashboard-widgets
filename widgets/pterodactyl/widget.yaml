id: pterodactyl
name: Pterodactyl
version: 0.3.2
apiVersion: 2
description: Nodes and game servers in a Pterodactyl panel (homepage's pterodactyl widget).
images: [pterodactyl/panel]   # the setup wizard recognises the service by these Docker images
refresh: 5m
options:
  url: { type: url, required: true }       # the panel, e.g. https://panel.lan
  key: { type: string, secret: true, required: true }   # an application API key (Admin > Application API), read on nodes and servers
attributes:                 # public values for a service's filter: (widget.<name>)
  nodes: { type: number, from: nodes }       # nodes
  servers: { type: number, from: servers }   # game servers on all nodes
