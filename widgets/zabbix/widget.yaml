id: zabbix
name: Zabbix
version: 0.3.1
apiVersion: 2
description: Problems in Zabbix by severity, from unclassified to disaster (homepage's zabbix widget).
refresh: 60s
defaultFields: [warning, average, high, disaster]
options:
  url: { type: url, required: true }       # the front end, e.g. http://zabbix.lan/zabbix
  key: { type: string, secret: true, required: true }   # Users > API tokens
attributes:                 # public values for a service's filter: (widget.<name>)
  unclassified: { type: number, from: unclassified }   # problems of severity unclassified
  information: { type: number, from: information }     # problems of severity information
  warning: { type: number, from: warning }             # problems of severity warning
  average: { type: number, from: average }             # problems of severity average
  high: { type: number, from: high }                   # problems of severity high
  disaster: { type: number, from: disaster }           # problems of severity disaster
  attention: { type: boolean, from: '@attention' }     # true while the card marks something as needing attention
