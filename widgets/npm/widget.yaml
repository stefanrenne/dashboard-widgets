id: npm
name: Nginx Proxy Manager
version: 0.3.2
apiVersion: 2
description: Proxy hosts enabled, disabled and in total (homepage's npm widget).
images: [jc21/nginx-proxy-manager]   # the setup wizard recognises the service by these Docker images
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://npm.lan:81
  username: { type: string, required: true }               # the e-mail address of a view-only user
  password: { type: string, secret: true, required: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  enabled: { type: number, from: enabled }     # proxy hosts enabled
  disabled: { type: number, from: disabled }   # proxy hosts disabled
  total: { type: number, from: total }         # proxy hosts in total
