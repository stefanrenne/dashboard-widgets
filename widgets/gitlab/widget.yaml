id: gitlab
name: GitLab
version: 0.3.2
apiVersion: 2
description: Groups, issues, merge requests and projects of a GitLab user (homepage's gitlab widget).
images: [gitlab/gitlab-ce, gitlab/gitlab-ee]   # the setup wizard recognises the service by these Docker images
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. https://gitlab.lan
  key: { type: string, secret: true, required: true }   # a personal access token with read_api
  user_id: { type: string, required: true }   # the number on your profile page (User ID)
attributes:                 # public values for a service's filter: (widget.<name>)
  groups: { type: number, from: groups }       # groups the user is a member of
  issues: { type: number, from: issues }       # issues of the user
  merges: { type: number, from: merges }       # merge requests of the user
  projects: { type: number, from: projects }   # projects of the user
