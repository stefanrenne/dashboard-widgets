id: unraid
name: Unraid
version: 0.5.1
apiVersion: 2
description: CPU, memory, array and pool usage through the Unraid API (Unraid 7 / Connect).
refresh: 15s
defaultFields: [memoryPercent, cpu, arrayUsedPercent, pool1UsedPercent]
options:
  url: { type: url, required: true }      # e.g. https://tower.lan
  key: { type: string, secret: true, required: true }   # Settings > Management Access > API Keys
  pool1: { type: string }                 # names of cache pools, e.g. cache, trunk
  pool2: { type: string }
  pool3: { type: string }
  pool4: { type: string }
attributes:                 # public values for a service's filter: (widget.<name>)
  memoryPercent: { type: number, from: memoryPercent }         # memory in use, in %
  cpu: { type: number, from: cpu }                             # CPU in use, in %
  notifications: { type: number, from: notifications }         # unread notifications
  status: { type: string, from: status }                       # the array's state, such as started or stopped
  arrayUsedPercent: { type: number, from: arrayUsedPercent }   # space in use on the array, in %
  pool1UsedPercent: { type: number, from: pool1UsedPercent }   # space in use on the pool named in pool1, in %
  attention: { type: boolean, from: '@attention' }             # true while the card marks something as needing attention
  arrayFree: { type: number }   # free space on the array, in GB
  pool1Free: { type: number }   # free space on pool1, in GB
  pool2Free: { type: number }   # free space on pool2, in GB
  pool3Free: { type: number }   # free space on pool3, in GB
  pool4Free: { type: number }   # free space on pool4, in GB
