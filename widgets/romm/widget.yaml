id: romm
name: RomM
version: 0.3.1
apiVersion: 2
description: Platforms, games, saves, states, screenshots and size of a RomM library (homepage's romm widget).
refresh: 5m
defaultFields: [platforms, totalRoms, saves, states]
options:
  url: { type: url, required: true }       # e.g. http://romm.lan:8080
  username: { type: string }               # when the stats need a login
  password: { type: string, secret: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  platforms: { type: number, from: platforms }       # platforms
  totalRoms: { type: number, from: totalRoms }       # games
  saves: { type: number, from: saves }               # saves
  states: { type: number, from: states }             # save states
  screenshots: { type: number, from: screenshots }   # screenshots
