id: lidarr
name: Lidarr
version: 0.3.1
apiVersion: 2
description: Wanted and queued albums and the number of artists (homepage's lidarr widget).
refresh: 1m
options:
  url: { type: url, required: true }      # e.g. http://lidarr.lan:8686
  key: { type: string, secret: true, required: true }   # Settings > General > API Key
attributes:                 # public values for a service's filter: (widget.<name>)
  wanted: { type: number, from: wanted }             # albums wanted and not downloaded
  queued: { type: number, from: queued }             # albums in the download queue
  artists: { type: number, from: artists }           # artists
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
