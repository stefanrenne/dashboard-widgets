id: komodo
name: Komodo
version: 0.3.2
apiVersion: 2
description: Containers, or stacks, or a summary of servers, stacks and containers, in Komodo (homepage's komodo widget).
images: [moghtech/komodo-core]   # the setup wizard recognises the service by these Docker images
refresh: 30s
defaultFields: [total, running, stopped, down, unhealthy, servers, stacks, containers]
options:
  url: { type: url, required: true }       # Komodo Core, e.g. http://komodo.lan:9120
  key: { type: string, secret: true, required: true }      # Settings > API Keys (K-...)
  secret: { type: string, secret: true, required: true }   # the key's secret (S-...)
  showStacks: { type: boolean, default: false }    # stacks instead of containers
  showSummary: { type: boolean, default: false }   # servers, stacks and containers running of all; wins over showStacks
attributes:                 # public values for a service's filter: (widget.<name>)
  total: { type: number, from: total }               # containers in total (stacks with showStacks)
  running: { type: number, from: running }           # containers running (stacks with showStacks)
  stopped: { type: number, from: stopped }           # containers stopped (stacks with showStacks)
  unhealthy: { type: number, from: unhealthy }       # containers unhealthy (stacks with showStacks)
  unknown: { type: number, from: unknown }           # containers in an unknown state (stacks with showStacks)
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
