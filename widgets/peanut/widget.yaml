id: peanut
name: PeaNUT
version: 0.3.1
apiVersion: 2
description: A UPS's battery charge, load and state through PeaNUT (homepage's peanut widget).
refresh: 30s
options:
  url: { type: url, required: true }       # e.g. http://peanut.lan:8080
  key: { type: string, secret: true, default: ups }   # the UPS's name in NUT (not a secret, but named key as in homepage)
  username: { type: string }               # when PeaNUT has authentication on
  password: { type: string, secret: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  battery_charge: { type: number, from: battery_charge }   # battery charge, in %
  ups_load: { type: number, from: ups_load }               # load on the UPS, in % of its capacity
  ups_status: { type: string, from: ups_status }           # the UPS's state: online, on_battery, low_battery or unknown
  attention: { type: boolean, from: '@attention' }         # true while the card marks something as needing attention
