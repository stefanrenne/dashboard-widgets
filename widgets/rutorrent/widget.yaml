id: rutorrent
name: ruTorrent
version: 0.4.0
apiVersion: 2
description: Active torrents and the upload and download rates in ruTorrent (homepage's rutorrent widget).
refresh: 15s
options:
  url: { type: url, required: true }       # e.g. http://rutorrent.lan
  username: { type: string }               # when ruTorrent sits behind basic authentication
  password: { type: string, secret: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  active: { type: number, from: active }   # Active
  download: { type: number }               # download rate of all torrents, in MB/s
  upload: { type: number }                 # upload rate of all torrents, in MB/s
