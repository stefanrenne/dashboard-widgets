id: openmeteo
name: Open-Meteo
version: 1.4.2
apiVersion: 2
description: The current weather from Open-Meteo, no account needed (homepage's recommended weather widget).
refresh: 5m
params: [latitude, longitude]   # the viewer's location, sent by client.js when the options have none
options:
  url: { type: url, default: https://api.open-meteo.com }   # e.g. your own Open-Meteo server
  latitude: { type: number }                                  # without latitude and longitude: the browser's location (HTTPS)
  longitude: { type: number }
  label: { type: string }                                     # e.g. the city
  timezone: { type: string }                                  # e.g. Europe/Amsterdam; default: the location's own
  units: { type: enum, values: [metric, imperial], default: metric }
  cache: { type: number, default: 5 }                         # minutes between calls to Open-Meteo
  format: { type: object }                                    # Intl.NumberFormat options, e.g. { maximumFractionDigits: 1 }
attributes:                 # public values for a service's filter: (widget.<name>)
  temperature: { type: number, from: temperature }   # the temperature now, in °C (°F with units: imperial)
  condition: { type: string, from: condition }       # the weather now, such as clear, cloudy or drizzle
