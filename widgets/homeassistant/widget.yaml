id: homeassistant
name: Home Assistant
version: 0.3.0
apiVersion: 2
description: People at home, lights and switches that are on, or up to four states and templates of your own (homepage's homeassistant widget).
refresh: 30s
options:
  url: { type: url, required: true }        # e.g. http://homeassistant.lan:8123
  key: { type: string, secret: true, required: true }   # a long-lived access token: your profile > Security
  # up to four of { state: <entity_id>, label?, value? } or { template: <Jinja>, label }, as in homepage
  custom: { type: list }
attributes:                 # public values for a service's filter: (widget.<name>)
  peopleHome: { type: number }   # people at home (without custom)
  lightsOn: { type: number }     # lights that are on (without custom)
  switchesOn: { type: number }   # switches that are on (without custom)
  custom1: { type: string }      # the first custom entry's value, as the card shows it (e.g. "on", "21.5 °C")
  custom2: { type: string }      # the second custom entry's value
  custom3: { type: string }      # the third custom entry's value
  custom4: { type: string }      # the fourth custom entry's value
