id: fileflows
name: FileFlows
version: 0.3.1
apiVersion: 2
description: Files waiting, being processed, processed and failed in FileFlows (homepage's fileflows widget).
refresh: 30s
options:
  url: { type: url, required: true }       # e.g. http://fileflows.lan:19200
  version: { type: number, default: 1 }    # 2 for FileFlows 26.10 and later
  key: { type: string, secret: true }      # version 2: the token of Settings > General > Fenrus Dashboard Endpoint
attributes:                 # public values for a service's filter: (widget.<name>)
  queue: { type: number, from: queue }               # files waiting to be processed
  processing: { type: number, from: processing }     # files being processed now
  processed: { type: number, from: processed }       # files processed
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
