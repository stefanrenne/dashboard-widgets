id: nextdns
name: NextDNS
version: 0.3.1
apiVersion: 2
description: Queries of a NextDNS profile resolved, blocked, allowed and relayed (homepage's nextdns widget).
refresh: 5m
options:
  profile: { type: string, required: true }   # Setup > Endpoints > ID
  key: { type: string, secret: true, required: true }   # Account > API
  url: { type: url, default: "https://api.nextdns.io" }   # only for testing against another server
attributes:                 # public values for a service's filter: (widget.<name>)
  default: { type: number, from: default }   # queries resolved, in NextDNS's default period
  blocked: { type: number, from: blocked }   # queries blocked, in NextDNS's default period
  allowed: { type: number, from: allowed }   # queries allowed by the allowlist, in NextDNS's default period
  relayed: { type: number, from: relayed }   # queries relayed, in NextDNS's default period
