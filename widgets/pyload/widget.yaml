id: pyload
name: pyLoad
version: 0.4.1
apiVersion: 2
description: Download rate, active and queued downloads in pyLoad (homepage's pyload widget).
images: [linuxserver/pyload-ng]   # the setup wizard recognises the service by these Docker images
refresh: 15s
options:
  url: { type: url, required: true }       # e.g. http://pyload.lan:8000
  username: { type: string }
  password: { type: string, secret: true }
  key: { type: string, secret: true }      # pyload-ng's API key, instead of a user
attributes:                 # public values for a service's filter: (widget.<name>)
  speed: { type: number }                  # download speed, in MB/s
  active: { type: number, from: active }   # downloads running
  queue: { type: number, from: queue }     # downloads in the queue
  total: { type: number, from: total }     # downloads in total
