id: strelaysrv
name: Syncthing Relay Server
version: 0.3.0
apiVersion: 2
description: Active sessions, connections, data relayed and the transfer rate of a Syncthing relay (homepage's strelaysrv widget).
refresh: 60s
options:
  url: { type: url, required: true }       # the relay's status port, e.g. http://relay.lan:22070
attributes:                 # public values for a service's filter: (widget.<name>)
  numActiveSessions: { type: number, from: numActiveSessions }   # Sessions
  numConnections: { type: number, from: numConnections }         # Connections
