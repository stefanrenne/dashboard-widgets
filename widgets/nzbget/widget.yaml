id: nzbget
name: NZBGet
version: 0.4.0
apiVersion: 2
description: Download rate, what is left in the queue and what was downloaded (homepage's nzbget widget).
refresh: 10s
options:
  url: { type: url, required: true }       # e.g. http://nzbget.lan:6789
  username: { type: string }               # ControlUsername (Settings > Security)
  password: { type: string, secret: true } # ControlPassword
attributes:                 # public values for a service's filter: (widget.<name>)
  rate: { type: number }                             # download rate in MB/s; 0 while paused
  remaining: { type: number }                        # still to download in the queue, in GB
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
