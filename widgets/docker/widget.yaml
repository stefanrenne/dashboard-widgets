id: docker
name: Docker container
version: 1.8.0
apiVersion: 2
description: State, CPU and memory of one container. Used for services with "container:".
refresh: 15s
options:
  container: { type: string, required: true }
  socket: { type: string }   # default /var/run/docker.sock
  url: { type: url }         # a Docker API or docker-socket-proxy, instead of a socket
  swarm: { type: boolean, default: false }   # also look for a Swarm service of that name (docker.yaml swarm: true)
  tlsCa: { type: string, secret: true }     # PEM text; filled in from docker.yaml tls.caFile
  tlsCert: { type: string, secret: true }   # PEM text; filled in from docker.yaml tls.certFile
  tlsKey: { type: string, secret: true }    # PEM text; filled in from docker.yaml tls.keyFile
attributes:                 # public values for a service's filter: (widget.<name>, or container.<name> for container:)
  status: { type: string, from: '@status' }          # up, warn (unhealthy) or down, as the status label
  attention: { type: boolean, from: '@attention' }   # true while the container is unhealthy, stopped or not found (container.attention)
