id: omada
name: TP-Link Omada
version: 0.3.2
apiVersion: 2
description: Access points, clients, alerts, gateways and switches of an Omada site (homepage's omada widget).
images: [mbentley/omada-controller]   # the setup wizard recognises the service by these Docker images
refresh: 60s
defaultFields: [connectedAp, activeUser, alerts, connectedGateways]
options:
  url: { type: url, required: true }       # the controller, e.g. https://omada.lan:8043
  username: { type: string, required: true }   # a viewer account is enough
  password: { type: string, secret: true, required: true }
  site: { type: string, required: true }   # the site's name, e.g. Default
  insecure: { type: boolean, default: false }  # accept the controller's self-signed certificate
attributes:                 # public values for a service's filter: (widget.<name>)
  connectedAp: { type: number, from: connectedAp }               # access points connected
  activeUser: { type: number, from: activeUser }                 # clients connected
  alerts: { type: number, from: alerts }                         # alerts on the site
  connectedGateways: { type: number, from: connectedGateways }   # gateways connected
  connectedSwitches: { type: number, from: connectedSwitches }   # switches connected
  attention: { type: boolean, from: '@attention' }               # true while the card marks something as needing attention
