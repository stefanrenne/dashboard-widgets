id: openwrt
name: OpenWrt
version: 0.4.0
apiVersion: 2
description: An OpenWrt router's uptime and load, or with interfaceName an interface's state and traffic (homepage's openwrt widget).
refresh: 30s
options:
  url: { type: url, required: true }       # the router, e.g. http://router.lan
  username: { type: string, required: true }   # an rpcd user with a read ACL (see the README)
  password: { type: string, secret: true, required: true }
  interfaceName: { type: string }          # a device, e.g. eth0; without it the system's uptime and load
attributes:                 # public values for a service's filter: (widget.<name>)
  status: { type: string, from: '@status' }          # up or down, as the status label
  cpuLoad: { type: number, from: cpuLoad }           # load average of the last 5 minutes; not set with interfaceName
  uptimeHours: { type: number }                      # hours since the router started; not set with interfaceName
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
