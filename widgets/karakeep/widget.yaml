id: karakeep
name: Karakeep
version: 0.3.1
apiVersion: 2
description: Bookmarks, favorites, archived items, highlights, lists and tags in Karakeep (homepage's karakeep widget).
refresh: 5m
defaultFields: [bookmarks, favorites, archived, highlights]
options:
  url: { type: url, required: true }       # e.g. http://karakeep.lan:3000
  key: { type: string, secret: true, required: true }   # User Settings > API Keys
attributes:                 # public values for a service's filter: (widget.<name>)
  bookmarks: { type: number, from: bookmarks }     # bookmarks
  favorites: { type: number, from: favorites }     # bookmarks marked as favorite
  archived: { type: number, from: archived }       # bookmarks archived
  highlights: { type: number, from: highlights }   # highlights
  lists: { type: number, from: lists }             # lists
  tags: { type: number, from: tags }               # tags
