id: mylar
name: Mylar3
version: 0.3.2
apiVersion: 2
description: Series, issues and wanted issues in Mylar3 (homepage's mylar widget).
images: [linuxserver/mylar3]   # the setup wizard recognises the service by these Docker images
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://mylar.lan:8090
  key: { type: string, secret: true, required: true }   # Settings > Web Interface > API key (with the API turned on)
attributes:                 # public values for a service's filter: (widget.<name>)
  series: { type: number, from: series }             # series
  issues: { type: number, from: issues }             # issues of all series
  wanted: { type: number, from: wanted }             # issues wanted and not downloaded
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
