id: feed
name: Feed
version: 0.3.0
apiVersion: 2
description: The latest items of an RSS or Atom feed, as a list or a grid of images (homepage's feed widget).
refresh: 10m
options:
  url: { type: url, required: true }       # the feed, e.g. https://example.com/rss.xml
  maxItems: { type: number, default: 5 }
  layout: { type: string, default: list }  # list, or grid for image tiles
  images: { type: boolean, default: true } # false hides the images
attributes:                 # public values for a service's filter: (widget.<name>)
  items: { type: number }    # items in the feed
  recent: { type: number }   # items published in the last 24 hours
