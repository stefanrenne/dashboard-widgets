id: wgeasy
name: wg-easy
version: 0.3.1
apiVersion: 2
description: WireGuard clients connected, enabled, disabled and in total in wg-easy (homepage's wgeasy widget).
refresh: 60s
defaultFields: [connected, enabled, total]
options:
  url: { type: url, required: true }       # e.g. http://wg.lan:51821
  version: { type: number, default: 1 }    # 2 for wg-easy 15 and later
  username: { type: string }               # wg-easy 15 and later
  password: { type: string, secret: true } # the web interface's password
  threshold: { type: number, default: 2 }  # minutes since the last handshake that still count as connected
attributes:                 # public values for a service's filter: (widget.<name>)
  connected: { type: number, from: connected }   # clients with a handshake within the threshold
  enabled: { type: number, from: enabled }       # clients enabled
  disabled: { type: number, from: disabled }     # clients disabled
  total: { type: number, from: total }           # clients in total
