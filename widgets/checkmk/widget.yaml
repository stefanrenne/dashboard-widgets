id: checkmk
name: Checkmk
version: 0.3.1
apiVersion: 2
description: Services and hosts that are not OK in a Checkmk site (homepage's checkmk widget).
refresh: 1m
options:
  url: { type: url, required: true }       # e.g. http://checkmk.lan:5000
  site: { type: string, required: true }   # the site name, e.g. cmk
  username: { type: string, required: true }               # an automation user
  password: { type: string, secret: true, required: true } # its automation secret
attributes:                 # public values for a service's filter: (widget.<name>)
  serviceErrors: { type: number, from: serviceErrors }   # services that are not OK
  hostErrors: { type: number, from: hostErrors }         # hosts that are not up
  attention: { type: boolean, from: '@attention' }       # true while the card marks something as needing attention
