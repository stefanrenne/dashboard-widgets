id: suwayomi
name: Suwayomi
version: 0.3.2
apiVersion: 2
description: Manga chapters downloaded or not and read or not in Suwayomi's library (homepage's suwayomi widget).
images: [suwayomi/tachidesk, suwayomi/suwayomi-server]   # the setup wizard recognises the service by these Docker images
refresh: 5m
defaultFields: [download, nondownload, read, unread]
options:
  url: { type: url, required: true }       # e.g. http://suwayomi.lan:4567
  username: { type: string }               # when Suwayomi has basic authentication on
  password: { type: string, secret: true }
  category: { type: number }               # one category's ID (?tab=<id> in its address); without it the whole library
attributes:                 # public values for a service's filter: (widget.<name>)
  download: { type: number, from: download }                         # chapters downloaded
  nondownload: { type: number, from: nondownload }                   # chapters not downloaded
  read: { type: number, from: read }                                 # chapters read
  unread: { type: number, from: unread }                             # chapters not read
  downloadedread: { type: number, from: downloadedread }             # chapters downloaded and read
  downloadedunread: { type: number, from: downloadedunread }         # chapters downloaded and not read
  nondownloadedread: { type: number, from: nondownloadedread }       # chapters read and not downloaded
  nondownloadedunread: { type: number, from: nondownloadedunread }   # chapters not downloaded and not read
