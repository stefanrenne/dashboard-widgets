id: azuredevops
name: Azure DevOps
version: 0.3.1
apiVersion: 2
description: The last run of a pipeline, and open pull requests in a repository (homepage's azuredevops widget).
refresh: 5m
options:
  organization: { type: string, required: true }
  project: { type: string, required: true }
  key: { type: string, secret: true, required: true }   # a personal access token with Build (read) and Code (read)
  definitionId: { type: string }    # the pipeline's definition id (in its address: definitionId=12)
  branchName: { type: string }      # only runs of this branch, e.g. refs/heads/main
  repositoryId: { type: string }    # pull requests: the repository's id or name
  userEmail: { type: string }       # pull requests: whose are "mine"
  url: { type: url, default: https://dev.azure.com }   # Azure DevOps Server: your collection's address
attributes:                 # public values for a service's filter: (widget.<name>)
  result: { type: string, from: result }             # the latest run's result (succeeded, failed, ...), or its status while it runs
  totalPrs: { type: number, from: totalPrs }         # open pull requests in the repository
  myPrs: { type: number, from: myPrs }               # open pull requests you created
  approved: { type: number, from: approved }         # open pull requests you created that have an approval
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
