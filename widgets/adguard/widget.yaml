id: adguard
name: AdGuard Home
version: 0.3.2
apiVersion: 2
description: DNS queries, blocked and filtered queries and the processing time of AdGuard Home (homepage's adguard widget).
images: [adguard/adguardhome]   # the setup wizard recognises the service by these Docker images
refresh: 1m
options:
  url: { type: url, required: true }       # e.g. http://adguard.lan:3000
  username: { type: string }               # the web interface login
  password: { type: string, secret: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  queries: { type: number, from: queries }     # DNS queries answered
  blocked: { type: number, from: blocked }     # DNS queries blocked by the filter lists
  filtered: { type: number, from: filtered }   # queries replaced by Safe Browsing, Safe Search or parental control
  latency: { type: number, from: latency }     # average processing time of a query, in ms
