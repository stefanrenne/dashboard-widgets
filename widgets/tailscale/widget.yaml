id: tailscale
name: Tailscale
version: 0.5.0
apiVersion: 2
description: Address, last seen and key expiry of one device in your tailnet, and more through fields (homepage's tailscale widget).
refresh: 5m
defaultFields: [address, last_seen, expires]
options:
  deviceid: { type: string, required: true }   # the device's ID from the admin console (ends in CNTRL)
  key: { type: string, secret: true, required: true }   # an API access token: Settings > Keys
  url: { type: url, default: https://api.tailscale.com }   # the Tailscale API
attributes:                 # public values for a service's filter: (widget.<name>)
  hostname: { type: string, from: hostname }                   # the device's host name, such as nas
  client_version: { type: string, from: client_version }       # the device's Tailscale version, such as 1.88.3
  os: { type: string, from: os }                               # the device's operating system, such as linux
  authorized: { type: boolean }                                # true when the device is authorized in the tailnet
  external: { type: boolean }                                  # true when the device is shared in from another tailnet
  update: { type: boolean }                                    # true when a Tailscale update is available for the device
  hoursSinceSeen: { type: number }                             # hours since the device was last seen; 0 while connected
  daysUntilExpiry: { type: number }                            # days until the device's key expires; 0 once expired, null when it never does
  attention: { type: boolean, from: '@attention' }             # true while the card marks something as needing attention
