id: http-status
name: HTTP status
version: 1.2.0
apiVersion: 1
description: Checks that a URL answers. Also used for the "siteMonitor" field of a service.
refresh: 30s
options:
  url: { type: url, required: true }
  method: { type: enum, values: [HEAD, GET], default: HEAD }
attributes:                 # public values for a service's filter: (widget.<name>)
  status: { type: string, from: '@status' }          # up or down, as the status label
  code: { type: number, from: status }               # the HTTP status code, such as 200
  latency: { type: number, from: latency }           # Latency, in ms
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
  available: { type: boolean }     # true while the URL answers as up: 2xx, 3xx, or 401/403 (siteMonitor.available)
  unavailable: { type: boolean }   # true while it is down: 5xx or no connection; another 4xx is neither
