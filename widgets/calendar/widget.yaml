id: calendar
name: Calendar
version: 0.2.0
apiVersion: 1
description: A month or an agenda with releases from Sonarr, Radarr, Lidarr and Readarr and events from iCal feeds (homepage's calendar widget).
refresh: 5m
params: [month]   # the month the viewer pages to (YYYY-MM)
options:
  view: { type: enum, values: [monthly, agenda], default: monthly }
  firstDayInWeek: { type: enum, values: [monday, sunday], default: monday }
  maxEvents: { type: number, default: 10 }   # events listed at most
  showTime: { type: boolean, default: false } # the time of today's events
  previousDays: { type: number, default: 0 }  # agenda: also the events of this many days ago
  timezone: { type: string }                  # e.g. Europe/Amsterdam; default the viewer's
  # [{ type: sonarr|radarr|lidarr|readarr|ical, service_group, service_name | url (+ key), name, color, baseUrl, params }]
  integrations: { type: list, secret: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  eventsToday: { type: number }  # events today, in the widget's timezone (UTC without one)
  failed: { type: number }       # integrations that did not answer
