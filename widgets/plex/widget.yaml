id: plex
name: Plex
version: 0.3.2
apiVersion: 2
description: Active streams and the size of the movie, TV and music libraries of a Plex Media Server (homepage's plex widget).
images: [plexinc/pms-docker]   # the setup wizard recognises the service by these Docker images
refresh: 15s
options:
  url: { type: url, required: true }        # e.g. http://plex.lan:32400
  key: { type: string, secret: true, required: true }   # your X-Plex-Token
attributes:                 # public values for a service's filter: (widget.<name>)
  streams: { type: number, from: streams }   # streams playing now
  albums: { type: number, from: albums }     # albums in all music libraries
  movies: { type: number, from: movies }     # movies in all movie libraries
  tv: { type: number, from: tv }             # shows in all TV libraries
